<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan</title>
    <link rel="stylesheet" href="country-card.css">
</head>

<body>
    <div class="card">
        <h1 id="country-name">Japan</h1>
        <p id="capital"><strong>Capital:</strong> Tokyo</p>
        <p id="population"><strong>Population:</strong> 126,476,461</p>
        <p id="annual-income"><strong>Annual Income:</strong> $400,000</p>
        <p id="climate"><strong>Climate:</strong> 4 Seasons</p>
        <p id="annual-cost-of-living"><strong>Annual Cost of Living:</strong> $30,000</p>
        <p id="currency"><strong>Currency:</strong> JPY</p>
        <p id="area"><strong>Area:</strong> 377,915 km²</p>
        <p id="language"><strong>Language:</strong> Japanese</p>
        <p id="president"><strong>President:</strong> Fumio Kishida</p>
        <p><strong>Transportation:</strong> Japan Railways</p>
        <img id="country-flag" src="" alt="Country Flag">
        <img id="country-map" src="" alt="Country Map">
        <input type="text" id="country-input" placeholder="Enter a country name">
        <button id="search-button">Search</button>      
        <button id="update-button">Update</button>
    </div>

    <script src="country-card.js"></script>
</body>
</html>
